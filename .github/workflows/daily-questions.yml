name: Daily Questions

on:
  schedule:
    # Runs at 00:00 IST (18:30 UTC) every day
    - cron: "30 18 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Date to generate (YYYY-MM-DD), empty for today"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: daily-questions

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            json
            lib/daily
            scripts

      - name: Generate today's questions
        env:
          TARGET_DATE: ${{ inputs.date }}
        run: node scripts/generate-daily-questions.mjs $TARGET_DATE

      - name: Commit changes
        id: commit
        run: |
          if [ -n "$(git status --porcelain json/daily)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add json/daily/history.json
            git commit -m "chore: add daily questions"
            git pull --rebase
            git push
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger Vercel deploy
        if: steps.commit.outputs.pushed == 'true' && env.VERCEL_DEPLOY_HOOK != ''
        run: curl -fsS -X POST "$VERCEL_DEPLOY_HOOK"
