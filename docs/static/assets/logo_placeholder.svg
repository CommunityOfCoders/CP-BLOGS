  <rect x="14" y="0" width="12" height="60" fill="#FDD835"/>
  <rect x="28" y="0" width="12" height="60" fill="#1E88E5"/>
  <!-- Club name text -->
  <text x="48" y="22" font-family="'Courier New', monospace" font-weight="bold" font-size="13" fill="#00ff88">CP CLUB</text>
  <text x="48" y="42" font-family="'Courier New', monospace" font-weight="bold" font-size="13" fill="#ffffff">VJTI</text>
